<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W2R - WMS Login</title>

<style>

/* =========================================================
   W2R LOGIN
   METALLIC BLUE / CYAN THEME
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
  background:#07111f;
  color:#eaf7ff;
  overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body{

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(0,174,255,.14),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #050d18,
      #07111f 50%,
      #081827
    );

}


/* =========================================================
   BACKGROUND GRID
========================================================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background-image:

    linear-gradient(
      rgba(0,207,255,.035) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(0,207,255,.035) 1px,
      transparent 1px
    );

  background-size:40px 40px;

  pointer-events:none;

}


/* =========================================================
   LOGIN WRAPPER
========================================================= */

.login-wrapper{

  width:100%;
  max-width:430px;

  padding:20px;

  position:relative;

  z-index:2;

}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card{

  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(13,32,52,.98),
      rgba(7,20,34,.98)
    );

  border:1px solid #1c425c;

  border-radius:18px;

  padding:38px 32px 30px;

  box-shadow:

    0 25px 70px rgba(0,0,0,.55),

    inset 0 0 45px
    rgba(0,174,255,.035),

    0 0 30px
    rgba(0,174,255,.08);

}


/* =========================================================
   TOP CYAN GLOW
========================================================= */

.login-card::before{

  content:"";

  position:absolute;

  top:-1px;

  left:15%;

  right:15%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00d9ff,
      #0077ff,
      #00d9ff,
      transparent
    );

  box-shadow:
    0 0 15px #00cfff;

}


/* =========================================================
   CORNER DECORATIONS
========================================================= */

.corner{

  position:absolute;

  width:25px;

  height:25px;

  border-color:#00cfff;

  opacity:.7;

}


/* TOP LEFT */

.corner.top-left{

  top:12px;

  left:12px;

  border-top:2px solid;

  border-left:2px solid;

}


/* TOP RIGHT */

.corner.top-right{

  top:12px;

  right:12px;

  border-top:2px solid;

  border-right:2px solid;

}


/* BOTTOM LEFT */

.corner.bottom-left{

  bottom:12px;

  left:12px;

  border-bottom:2px solid;

  border-left:2px solid;

}


/* BOTTOM RIGHT */

.corner.bottom-right{

  bottom:12px;

  right:12px;

  border-bottom:2px solid;

  border-right:2px solid;

}


/* =========================================================
   METALLIC SUPERHERO A LOGO
========================================================= */

.logo{

  width:78px;

  height:78px;

  margin:0 auto 20px;

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;


  /* METALLIC OUTER RING */

  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #b8c7d1 18%,
      #4e6675 42%,
      #dce8ee 58%,
      #718795 78%,
      #f5fbff 100%
    );


  border:3px solid #dff8ff;


  box-shadow:

    0 0 0 3px #071522,

    0 0 0 5px #4b91b0,

    0 0 20px
    rgba(0,217,255,.65),

    0 0 45px
    rgba(0,119,255,.30),

    inset 0 3px 5px
    rgba(255,255,255,.8),

    inset 0 -5px 8px
    rgba(0,0,0,.55);

}


/* =========================================================
   INNER BLUE CIRCLE
========================================================= */

.logo::before{

  content:"";

  position:absolute;

  width:58px;

  height:58px;

  border-radius:50%;


  background:
    radial-gradient(
      circle at 35% 25%,
      #48e8ff,
      #087fc0 45%,
      #03436d 75%,
      #021c30 100%
    );


  border:2px solid #8cecff;


  box-shadow:

    inset 0 3px 8px
    rgba(255,255,255,.35),

    inset 0 -6px 10px
    rgba(0,0,0,.6);

}


/* =========================================================
   A SYMBOL
========================================================= */

.logo::after{

  content:"A";

  position:absolute;

  color:#ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:39px;

  font-weight:900;

  font-style:italic;

  line-height:1;

  transform:
    skewX(-8deg);


  text-shadow:

    2px 2px 0 #17465f,

    3px 3px 0 #0a2d43,

    0 0 5px #ffffff,

    0 0 12px #00d9ff;

}


/* =========================================================
   LOGO HIGHLIGHT
========================================================= */

.logo span{

  position:absolute;

  width:8px;

  height:8px;

  border-radius:50%;

  background:#ffffff;

  top:13px;

  left:18px;

  opacity:.75;

  filter:blur(1px);

  z-index:5;

}


/* =========================================================
   TITLE
========================================================= */

.title{

  text-align:center;

  margin-bottom:5px;

  color:#ffffff;

  font-size:23px;

  font-weight:bold;

  letter-spacing:2px;

  text-shadow:
    0 0 10px
    rgba(0,207,255,.15);

}


.subtitle{

  text-align:center;

  color:#5f91ad;

  font-size:10px;

  letter-spacing:1.5px;

  margin-bottom:28px;

}


/* =========================================================
   SYSTEM STATUS
========================================================= */

.system-status{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-bottom:22px;

  color:#55e1ff;

  font-size:9px;

  font-weight:bold;

  letter-spacing:1px;

}


.status-dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#00e5a0;

  box-shadow:
    0 0 10px
    rgba(0,229,160,.9);

}


/* =========================================================
   FORM
========================================================= */

.form-group{

  margin-bottom:18px;

}


.form-group label{

  display:block;

  margin-bottom:7px;

  color:#7fa8be;

  font-size:10px;

  font-weight:bold;

  text-transform:uppercase;

  letter-spacing:1px;

}


/* =========================================================
   INPUT
========================================================= */

.input-wrapper{

  position:relative;

}


.input-icon{

  position:absolute;

  left:12px;

  top:50%;

  transform:translateY(-50%);

  color:#3e7894;

  font-size:14px;

  pointer-events:none;

}


input{

  width:100%;

  height:44px;

  border:1px solid #21445d;

  border-radius:8px;

  background:#071522;

  color:#eafaff;

  padding:0 12px 0 38px;

  outline:none;

  font-size:13px;

  transition:.2s;

}


input::placeholder{

  color:#46697d;

}


input:focus{

  border-color:#00cfff;

  box-shadow:

    0 0 0 2px
    rgba(0,207,255,.08),

    0 0 15px
    rgba(0,207,255,.08);

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn{

  width:100%;

  height:44px;

  border:0;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #0077ff,
      #00cfff
    );

  color:white;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

  cursor:pointer;

  margin-top:4px;

  box-shadow:
    0 5px 20px
    rgba(0,153,255,.25);

  transition:.2s;

}


.login-btn:hover{

  filter:brightness(1.15);

  transform:translateY(-1px);

  box-shadow:
    0 7px 25px
    rgba(0,174,255,.35);

}


.login-btn:active{

  transform:translateY(0);

}


.login-btn:disabled{

  cursor:not-allowed;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  display:none;

  text-align:center;

  margin-top:12px;

  color:#51ddff;

  font-size:9px;

  letter-spacing:1px;

}


.loading.active{

  display:block;

}


/* =========================================================
   LOADING ANIMATION
========================================================= */

.loading::after{

  content:"";

  display:inline-block;

  width:10px;

  animation:
    dots 1.2s infinite;

}


@keyframes dots{

  0%{
    content:"";
  }

  33%{
    content:".";
  }

  66%{
    content:"..";
  }

  100%{
    content:"...";
  }

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  margin-top:25px;

  padding-top:16px;

  border-top:1px solid #173349;

  text-align:center;

  color:#456a81;

  font-size:9px;

  line-height:1.7;

}


.footer strong{

  color:#5b91aa;

}


/* =========================================================
   SECURITY BADGE
========================================================= */

.security{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:6px;

  margin-top:10px;

  color:#3f687d;

  font-size:8px;

  letter-spacing:.7px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  .login-wrapper{

    padding:15px;

  }


  .login-card{

    padding:30px 22px 25px;

  }


  .title{

    font-size:19px;

  }


  .logo{

    width:70px;

    height:70px;

  }


  .logo::before{

    width:52px;

    height:52px;

  }


  .logo::after{

    font-size:35px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN WRAPPER
====================================================== -->

<div class="login-wrapper">


  <!-- ===================================================
       LOGIN CARD
  ==================================================== -->

  <div class="login-card">


    <!-- CORNER DECORATIONS -->

    <div class="corner top-left"></div>

    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>

    <div class="corner bottom-right"></div>


    <!-- =================================================
         SUPERHERO A LOGO
    ================================================== -->

    <div class="logo">

      <span></span>

    </div>


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="title">

      WMS LOGIN

    </div>


    <div class="subtitle">

      WAREHOUSE QR MANAGEMENT SYSTEM

    </div>


    <!-- =================================================
         SYSTEM STATUS
    ================================================== -->

    <div class="system-status">

      <div class="status-dot"></div>

      SYSTEM READY

    </div>


    <!-- =================================================
         USERNAME
    ================================================== -->

    <div class="form-group">

      <label for="username">

        Username

      </label>


      <div class="input-wrapper">

        <div class="input-icon">

          👤

        </div>


        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          onkeydown="handleEnter(event)"
        >

      </div>

    </div>


    <!-- =================================================
         LOGIN BUTTON
    ================================================== -->

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >

      LOGIN TO W2R

    </button>


    <!-- =================================================
         LOADING
    ================================================== -->

    <div
      class="loading"
      id="loading"
    >

      AUTHENTICATING

    </div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="footer">

      W2R WAREHOUSE SYSTEM

      <br>

      <strong>
        QR PROCESSING STATION
      </strong>


      <div class="security">

        🔒 SECURE SESSION

      </div>

    </div>


  </div>

</div>


<!-- =====================================================
     LOGGER
====================================================== -->

<script src="logger.js"></script>


<script>

/* =========================================================
   ENTER KEY
========================================================= */

function handleEnter(event){

  if(event.key === "Enter"){

    login();

  }

}


/* =========================================================
   LOGIN FUNCTION
========================================================= */

function login(){

  const usernameInput =
    document.getElementById(
      "username"
    );


  const loginBtn =
    document.getElementById(
      "loginBtn"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  const user =
    usernameInput.value.trim();


  /* =====================================================
     CHECK USERNAME
  ====================================================== */

  if(user === ""){

    alert(
      "Please enter username."
    );

    usernameInput.focus();

    return;

  }


  /* =====================================================
     SAVE USER SESSION
  ====================================================== */

  sessionStorage.setItem(
    "wms_user",
    user
  );


  /* =====================================================
     TRACK LOGIN
  ====================================================== */

  if(
    typeof track === "function"
  ){

    track(
      "LOGIN"
    );

  }


  /* =====================================================
     TELEGRAM LOG
  ====================================================== */

  if(
    typeof sendLog === "function" &&
    typeof getTime === "function"
  ){

    sendLog(

      `🔐 LOGIN\n` +
      `👤 ${user}\n` +
      `⏰ ${getTime()}`

    );

  }


  /* =====================================================
     SHOW AUTHENTICATION
  ====================================================== */

  loginBtn.disabled = true;

  loginBtn.style.opacity = ".65";

  loading.classList.add(
    "active"
  );


  /* =====================================================
     REDIRECT
  ====================================================== */

  setTimeout(

    function(){

      window.location.href =
        "index.html";

    },

    350

  );

}


/* =========================================================
   AUTO FOCUS
========================================================= */

window.addEventListener(

  "load",

  function(){

    document
      .getElementById("username")
      .focus();

  }

);

</script>


</body>

</html>
