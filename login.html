<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W2R - WMS Login</title>

<style>

/* =========================================================
   WELCOME TO STARK QR
   DARK NAVY + CYAN + AVENGERS LOGO
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(0,190,255,.12),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #030a13,
      #071522,
      #020812
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#eaf8ff;
  overflow:hidden;
}


/* =========================================================
   BACKGROUND EFFECT
========================================================= */

.background-grid{
  position:fixed;
  inset:0;

  background-image:
    linear-gradient(
      rgba(0,210,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,210,255,.025) 1px,
      transparent 1px
    );

  background-size:40px 40px;

  pointer-events:none;
}


/* =========================================================
   LOGIN CONTAINER
========================================================= */

.login-container{
  width:390px;
  max-width:90%;

  background:
    linear-gradient(
      145deg,
      rgba(12,31,48,.97),
      rgba(5,17,29,.98)
    );

  border:1px solid #1b4b67;

  border-radius:18px;

  padding:34px 35px 30px;

  text-align:center;

  box-shadow:
    0 20px 70px rgba(0,0,0,.55),
    inset 0 0 35px rgba(0,190,255,.035);

  position:relative;

  z-index:2;
}


/* =========================================================
   TOP CYAN LINE
========================================================= */

.login-container::before{
  content:"";

  position:absolute;

  top:0;
  left:12%;
  right:12%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00d9ff,
      #0077ff,
      #00d9ff,
      transparent
    );

  box-shadow:
    0 0 15px #00cfff;

  border-radius:10px;
}


/* =========================================================
   AVENGERS LOGO
========================================================= */

.logo-wrapper{
  width:100px;
  height:100px;

  margin:0 auto 17px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,191,255,.14),
      rgba(0,50,80,.08),
      transparent 70%
    );

  border:1px solid #1d526c;

  box-shadow:
    0 0 25px rgba(0,190,255,.16),
    inset 0 0 20px rgba(0,190,255,.08);
}

.login-logo{
  width:78px;
  height:78px;

  object-fit:contain;

  display:block;

  filter:
    drop-shadow(0 0 8px rgba(0,210,255,.35))
    drop-shadow(0 0 18px rgba(0,120,255,.18));
}


/* =========================================================
   BRAND
========================================================= */

.brand-title{
  font-size:24px;

  font-weight:bold;

  letter-spacing:2px;

  color:#ffffff;

  text-shadow:
    0 0 10px rgba(0,200,255,.15);
}

.brand-subtitle{
  margin-top:6px;

  font-size:10px;

  letter-spacing:2px;

  color:#5c91ac;
}


/* =========================================================
   STATUS
========================================================= */

.system-status{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:7px;

  margin-top:18px;

  color:#55dfff;

  font-size:9px;

  font-weight:bold;

  letter-spacing:1px;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#00e59a;

  box-shadow:
    0 0 8px #00e59a;
}


/* =========================================================
   FORM
========================================================= */

.login-form{
  margin-top:25px;

  text-align:left;
}

.input-label{
  display:block;

  color:#79a8bd;

  font-size:10px;

  font-weight:bold;

  letter-spacing:1px;

  margin-bottom:7px;

  text-transform:uppercase;
}

.input-wrapper{
  position:relative;
}

.input-icon{
  position:absolute;

  left:12px;

  top:50%;

  transform:translateY(-50%);

  color:#3e87a7;

  font-size:13px;

  pointer-events:none;
}

input{
  width:100%;

  height:45px;

  padding:0 12px 0 38px;

  border-radius:8px;

  border:1px solid #21465e;

  background:#07131f;

  color:#eafaff;

  outline:none;

  font-size:13px;

  transition:.2s;
}

input::placeholder{
  color:#46697d;
}

input:focus{
  border-color:#00cfff;

  box-shadow:
    0 0 0 2px rgba(0,207,255,.08),
    0 0 15px rgba(0,207,255,.08);
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn{
  width:100%;

  height:45px;

  margin-top:16px;

  border:0;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #006cff,
      #00cfff
    );

  color:white;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;

  cursor:pointer;

  box-shadow:
    0 5px 20px rgba(0,130,255,.25);

  transition:.2s;
}

.login-btn:hover{
  filter:brightness(1.15);

  box-shadow:
    0 5px 25px rgba(0,190,255,.35);
}

.login-btn:active{
  transform:scale(.98);
}


/* =========================================================
   LOADING
========================================================= */

.loading{
  display:none;

  margin-top:15px;

  color:#59dcff;

  font-size:10px;

  letter-spacing:1px;
}

.loading-spinner{
  display:inline-block;

  width:12px;
  height:12px;

  border:2px solid #24536a;

  border-top-color:#00d9ff;

  border-radius:50%;

  vertical-align:middle;

  margin-right:6px;

  animation:spin .7s linear infinite;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =========================================================
   ERROR MESSAGE
========================================================= */

.error-message{
  display:none;

  margin-top:12px;

  padding:9px;

  border-radius:7px;

  border:1px solid #6b2931;

  background:#35151b;

  color:#ff8f9a;

  font-size:10px;

  text-align:center;
}


/* =========================================================
   FOOTER
========================================================= */

.login-footer{
  margin-top:24px;

  padding-top:15px;

  border-top:1px solid #18364b;

  color:#41657a;

  font-size:9px;

  line-height:1.6;

  letter-spacing:.5px;
}

.login-footer strong{
  color:#5b92aa;
}


/* =========================================================
   DECORATION
========================================================= */

.corner{
  position:absolute;

  width:20px;
  height:20px;

  border-color:#00bfe8;

  opacity:.6;
}

.corner.tl{
  top:12px;
  left:12px;

  border-top:1px solid;
  border-left:1px solid;
}

.corner.tr{
  top:12px;
  right:12px;

  border-top:1px solid;
  border-right:1px solid;
}

.corner.bl{
  bottom:12px;
  left:12px;

  border-bottom:1px solid;
  border-left:1px solid;
}

.corner.br{
  bottom:12px;
  right:12px;

  border-bottom:1px solid;
  border-right:1px solid;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  .login-container{
    padding:28px 24px 25px;
  }

  .brand-title{
    font-size:21px;
  }

}

</style>

</head>


<body>


<div class="background-grid"></div>


<div class="login-container">


  <!-- CORNER DECORATIONS -->

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>


  <!-- AVENGERS LOGO -->

  <div class="logo-wrapper">

    <img
      src="https://www.freepnglogos.com/uploads/avengers-png-logo/avengers-logo-transparent-png-image-download-2.png"
      alt="Avengers Logo"
      class="login-logo"
    >

  </div>


  <!-- BRAND -->

  <div class="brand-title">
    WELCOME TO STARK QR
  </div>

  <div class="brand-subtitle">
    WAREHOUSE MANAGEMENT SYSTEM
  </div>


  <!-- SYSTEM STATUS -->

  <div class="system-status">

    <div class="status-dot"></div>

    SYSTEM READY

  </div>


  <!-- LOGIN -->

  <div class="login-form">

    <label
      class="input-label"
      for="username"
    >
      Username
    </label>


    <div class="input-wrapper">

      <span class="input-icon">
        👤
      </span>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        autocomplete="username"
        onkeydown="handleEnter(event)"
      >

    </div>


    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      LOGIN TO W2R
    </button>


    <!-- LOADING -->

    <div
      class="loading"
      id="loading"
    >

      <span class="loading-spinner"></span>

      AUTHENTICATING OPERATOR...

    </div>


    <!-- ERROR -->

    <div
      class="error-message"
      id="errorMessage"
    >
      Please enter your username.
    </div>

  </div>


  <!-- FOOTER -->

  <div class="login-footer">

    <strong>Sharath QR SYSTEM</strong><br>

    Secure Operator Access • QR Management Station

  </div>


</div>


<!-- =====================================================
     LOGGER
====================================================== -->

<script src="logger.js"></script>


<script>

/* =========================================================
   ENTER KEY
========================================================= */

function handleEnter(event){

  if(event.key === "Enter"){

    login();

  }

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const usernameInput =
    document.getElementById("username");

  const loginBtn =
    document.getElementById("loginBtn");

  const loading =
    document.getElementById("loading");

  const errorMessage =
    document.getElementById("errorMessage");


  const user =
    usernameInput.value.trim();


  /* =========================
     VALIDATION
  ========================= */

  if(user === ""){

    errorMessage.style.display =
      "block";

    usernameInput.focus();

    return;

  }


  errorMessage.style.display =
    "none";


  /* =========================
     SAVE USER
  ========================= */

  sessionStorage.setItem(
    "wms_user",
    user
  );


  /* =========================
     TRACK LOGIN
  ========================= */

  if(typeof track === "function"){

    track("LOGIN");

  }


  /* =========================
     SHOW LOADING
  ========================= */

  loginBtn.disabled = true;

  loginBtn.style.opacity = ".6";

  loading.style.display =
    "block";


  /* =========================
     TELEGRAM LOG
  ========================= */

  if(
    typeof sendLog === "function" &&
    typeof getTime === "function"
  ){

    sendLog(
      `🔐 LOGIN\n` +
      `👤 ${user}\n` +
      `⏰ ${getTime()}`
    );

  }


  /* =========================
     REDIRECT
     
     Small delay allows the
     loading screen to appear
     before moving to index.
  ========================= */

  setTimeout(
    function(){

      window.location.href =
        "index.html";

    },
    500
  );

}


/* =========================================================
   AUTO FOCUS
========================================================= */

window.addEventListener(
  "load",
  function(){

    document
      .getElementById("username")
      .focus();

  }
);

</script>


</body>

</html>
