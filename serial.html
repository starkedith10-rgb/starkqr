<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STARK QR - Serial QR Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      font-family:'Orbitron',sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #173b68 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #0b2848 0%, transparent 35%),
        #061522;
      color:#dff6ff;
    }

    /* MAIN CONTAINER */

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    /* LEFT PANEL */

    .left-panel{
      width:300px;
      min-width:300px;
      height:100vh;

      padding:22px;

      background:
        linear-gradient(
          180deg,
          rgba(7,35,58,0.98),
          rgba(3,19,32,0.98)
        );

      border-right:1px solid #16d9ff;

      box-shadow:
        0 0 25px rgba(0,217,255,0.15),
        inset -5px 0 20px rgba(0,217,255,0.05);

      display:flex;
      flex-direction:column;

      overflow-y:auto;
    }

    /* LOGO */

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo h1{
      color:#16d9ff;
      font-size:25px;
      letter-spacing:3px;

      text-shadow:
        0 0 5px #16d9ff,
        0 0 15px rgba(22,217,255,0.7),
        3px 3px 0 #06304a;
    }

    .logo p{
      margin-top:5px;
      color:#76c8e8;
      font-size:10px;
      letter-spacing:2px;
    }

    /* FILE AREA */

    .section{
      background:rgba(11,45,70,0.7);
      border:1px solid rgba(22,217,255,0.35);
      border-radius:12px;
      padding:15px;
      margin-bottom:14px;

      box-shadow:
        inset 0 0 15px rgba(22,217,255,0.05);
    }

    .section-title{
      color:#16d9ff;
      font-size:12px;
      margin-bottom:10px;
      letter-spacing:1px;
    }

    input[type="file"]{
      width:100%;
      color:#dff6ff;
      background:#08263d;
      border:1px solid #167ca1;
      border-radius:7px;
      padding:8px;
      font-family:Arial,sans-serif;
      font-size:12px;
    }

    input[type="file"]::file-selector-button{
      background:#16d9ff;
      color:#032032;
      border:none;
      border-radius:5px;
      padding:6px 10px;
      margin-right:8px;
      font-weight:bold;
      cursor:pointer;
    }

    /* STAT BOXES */

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .stat-box{
      background:
        linear-gradient(
          145deg,
          rgba(10,62,91,0.9),
          rgba(4,31,50,0.9)
        );

      border:1px solid #145d7d;
      border-radius:10px;

      padding:13px 8px;

      text-align:center;

      box-shadow:
        inset 0 0 12px rgba(22,217,255,0.05);
    }

    .stat-icon{
      color:#16d9ff;
      font-size:18px;
      margin-bottom:5px;
    }

    .stat-label{
      font-family:Arial,sans-serif;
      font-size:10px;
      color:#8ab9cb;
    }

    .stat-value{
      color:#ffffff;
      font-size:20px;
      margin-top:4px;
      text-shadow:0 0 8px rgba(22,217,255,0.5);
    }

    /* SETTINGS */

    .setting{
      margin-bottom:10px;
    }

    .setting:last-child{
      margin-bottom:0;
    }

    .setting label{
      display:block;
      color:#8bd8f2;
      font-size:10px;
      margin-bottom:4px;
    }

    select,
    input[type="number"]{
      width:100%;
      padding:7px;

      color:#dff6ff;
      background:#08263d;

      border:1px solid #167ca1;
      border-radius:6px;

      font-family:Arial,sans-serif;
      font-size:12px;
    }

    select:focus,
    input[type="number"]:focus{
      outline:none;
      border-color:#16d9ff;
      box-shadow:0 0 8px rgba(22,217,255,0.3);
    }

    /* BUTTON */

    .side-button{
      width:100%;
      padding:9px;

      border:1px solid #16d9ff;
      border-radius:7px;

      background:#0a344e;
      color:#16d9ff;

      font-family:'Orbitron',sans-serif;
      font-size:10px;
      font-weight:bold;

      cursor:pointer;
      transition:0.2s;
    }

    .side-button:hover{
      background:#16d9ff;
      color:#032032;
      box-shadow:0 0 15px rgba(22,217,255,0.5);
    }

    /* QUOTE */

    .quote{
      margin-top:auto;

      padding-top:15px;

      border-top:1px solid rgba(22,217,255,0.25);

      color:#669db2;

      font-family:Arial,sans-serif;
      font-size:10px;
      line-height:1.5;

      text-align:center;
    }

    /* RIGHT PANEL */

    .right-panel{
      flex:1;
      height:100vh;

      display:flex;
      flex-direction:column;
      align-items:center;

      padding:18px;

      background:
        radial-gradient(
          circle at center,
          rgba(15,65,92,0.35),
          transparent 55%
        );
    }

    /* TOP STATUS */

    .top-status{
      width:100%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:10px;
    }

    .status-title{
      color:#16d9ff;
      font-size:13px;
      letter-spacing:2px;

      text-shadow:0 0 8px rgba(22,217,255,0.5);
    }

    .live{
      display:flex;
      align-items:center;
      gap:6px;

      color:#55ff9a;
      font-family:Arial,sans-serif;
      font-size:10px;
      font-weight:bold;
    }

    .live-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#55ff9a;

      box-shadow:
        0 0 8px #55ff9a;

      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:0.35;
      }

      100%{
        opacity:1;
      }

    }

    /* QR AREA */

    .qr-wrapper{
      flex:1;

      width:100%;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:0;
    }

    .qr-frame{
      padding:12px;

      background:#ffffff;

      border-radius:12px;

      border:3px solid #16d9ff;

      box-shadow:
        0 0 15px rgba(22,217,255,0.45),
        0 0 45px rgba(22,217,255,0.12);

      display:flex;
      justify-content:center;
      align-items:center;

      max-width:90%;
      max-height:90%;
    }

    #qrCanvas{
      display:block;
      max-width:100%;
      max-height:100%;
    }

    /* NAVIGATION */

    .navigation{
      width:100%;

      display:flex;
      justify-content:center;
      align-items:center;

      flex-wrap:wrap;

      gap:7px;

      padding-top:10px;
    }

    .nav-button{
      background:#0a344e;
      color:#16d9ff;

      border:1px solid #167ca1;
      border-radius:6px;

      padding:8px 13px;

      font-family:'Orbitron',sans-serif;
      font-size:10px;
      font-weight:bold;

      cursor:pointer;

      transition:0.2s;
    }

    .nav-button:hover{
      background:#16d9ff;
      color:#032032;

      box-shadow:
        0 0 12px rgba(22,217,255,0.5);
    }

    .download-button{
      background:#16d9ff;
      color:#032032;

      border-color:#16d9ff;
    }

    .download-button:hover{
      background:#55e7ff;
    }

    /* RESPONSIVE */

    @media(max-width:700px){

      .left-panel{
        width:220px;
        min-width:220px;
        padding:12px;
      }

      .logo h1{
        font-size:19px;
      }

      .nav-button{
        padding:7px 9px;
        font-size:9px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- LEFT PANEL -->

  <div class="left-panel">

    <div class="logo">

      <h1>STARK QR</h1>

      <p>SERIAL QR GENERATOR</p>

    </div>


    <!-- EXCEL -->

    <div class="section">

      <div class="section-title">
        EXCEL DATA SOURCE
      </div>

      <input
        type="file"
        id="fileInput"
        accept=".xlsx,.xls,.csv"
      >

    </div>


    <!-- QR STATISTICS -->

    <div class="section">

      <div class="section-title">
        GENERATION STATUS
      </div>

      <div class="stats">

        <div class="stat-box">

          <div class="stat-icon">
            ▦
          </div>

          <div class="stat-label">
            TOTAL ROWS
          </div>

          <div
            class="stat-value"
            id="totalRows"
          >
            0
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-icon">
            ▣
          </div>

          <div class="stat-label">
            TOTAL QR
          </div>

          <div
            class="stat-value"
            id="totalQR"
          >
            0
          </div>

        </div>

      </div>

    </div>


    <!-- CURRENT QR -->

    <div class="section">

      <div class="section-title">
        CURRENT QR
      </div>

      <div class="stats">

        <div class="stat-box">

          <div class="stat-label">
            QR NUMBER
          </div>

          <div
            class="stat-value"
            id="counter"
          >
            0 / 0
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            ROWS IN QR
          </div>

          <div
            class="stat-value"
            id="info"
          >
            0
          </div>

        </div>

      </div>

    </div>


    <!-- SETTINGS -->

    <div class="section">

      <div class="section-title">
        QR SETTINGS
      </div>


      <div class="setting">

        <label for="moduleWidthUnit">
          MODULE WIDTH UNIT
        </label>

        <select id="moduleWidthUnit">

          <option value="default" selected>
            Fit (Default)
          </option>

          <option value="px">
            Pixels
          </option>

          <option value="mm">
            Millimeters
          </option>

          <option value="in">
            Inches
          </option>

        </select>

      </div>


      <div class="setting">

        <label for="moduleWidth">
          MODULE WIDTH
        </label>

        <input
          type="number"
          id="moduleWidth"
          value="4"
          min="1"
          max="20"
        >

      </div>


      <div class="setting">

        <label for="dpi">
          IMAGE RESOLUTION (DPI)
        </label>

        <input
          type="number"
          id="dpi"
          value="96"
          min="72"
          max="300"
        >

      </div>


      <div class="setting">

        <label for="imageFormat">
          IMAGE FORMAT
        </label>

        <select id="imageFormat">

          <option value="png" selected>
            PNG
          </option>

          <option value="jpeg">
            JPEG
          </option>

          <option value="webp">
            WEBP
          </option>

        </select>

      </div>


      <button
        class="side-button"
        id="refreshQRBtn"
      >
        ↻ REFRESH QR
      </button>

    </div>


    <div class="quote">

      "No amount of money ever bought a single second of time."
      <br>
      – Tony Stark

    </div>

  </div>


  <!-- RIGHT PANEL -->

  <div class="right-panel">


    <div class="top-status">

      <div class="status-title">
        SERIAL QR OUTPUT
      </div>

      <div class="live">

        <span class="live-dot"></span>

        SYSTEM READY

      </div>

    </div>


    <div class="qr-wrapper">

      <div class="qr-frame">

        <canvas id="qrCanvas"></canvas>

      </div>

    </div>


    <div class="navigation">

      <button
        class="nav-button"
        id="prevBtn"
      >
        ← PREVIOUS
      </button>


      <button
        class="nav-button"
        id="nextBtn"
      >
        NEXT →
      </button>


      <button
        class="nav-button"
        id="refreshBtn"
      >
        🔃 PAGE RESET
      </button>


      <button
        class="nav-button download-button"
        id="downloadBtn"
      >
        ↓ DOWNLOAD QR
      </button>

    </div>


  </div>

</div>


<!-- LOGGER -->

<script src="logger.js"></script>


<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

let user = sessionStorage.getItem("wms_user");

if(!user){

  window.location.href = "login.html";

}


/* =========================================================
   PAGE TRACKING
========================================================= */

trackPage("SERIAL PAGE OPEN");


/* =========================================================
   VARIABLES
========================================================= */

let qrBatches = [];

let batchRowCounts = [];

let currentIndex = 0;

let totalExcelRows = 0;

const MAX_QR_LENGTH = 2200;


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
  document.getElementById("fileInput");

const qrCanvas =
  document.getElementById("qrCanvas");

const counter =
  document.getElementById("counter");

const info =
  document.getElementById("info");

const totalRows =
  document.getElementById("totalRows");

const totalQR =
  document.getElementById("totalQR");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const moduleWidthInput =
  document.getElementById("moduleWidth");

const dpiInput =
  document.getElementById("dpi");

const imageFormatSelect =
  document.getElementById("imageFormat");

const refreshQRBtn =
  document.getElementById("refreshQRBtn");


/* =========================================================
   EVENTS
========================================================= */

fileInput.addEventListener(
  "change",
  handleFile
);

prevBtn.addEventListener(
  "click",
  prevQR
);

nextBtn.addEventListener(
  "click",
  nextQR
);

downloadBtn.addEventListener(
  "click",
  downloadQR
);

refreshBtn.addEventListener(
  "click",
  refreshApp
);

refreshQRBtn.addEventListener(
  "click",
  function(){

    if(qrBatches.length > 0){

      generateQR();

    }

  }
);

moduleWidthInput.addEventListener(
  "input",
  function(){

    if(qrBatches.length > 0){

      generateQR();

    }

  }
);

dpiInput.addEventListener(
  "input",
  function(){

    if(qrBatches.length > 0){

      generateQR();

    }

  }
);

window.addEventListener(
  "resize",
  function(){

    if(qrBatches.length > 0){

      generateQR();

    }

  }
);


/* =========================================================
   EXCEL UPLOAD
========================================================= */

function handleFile(e){

  const file =
    e.target.files[0];

  if(!file){

    return;

  }


  /* Log Excel filename */

  track(
    "EXCEL UPLOAD - " + file.name
  );


  const reader =
    new FileReader();


  reader.onload =
    function(event){

      try{

        const data =
          new Uint8Array(
            event.target.result
          );


        const workbook =
          XLSX.read(
            data,
            {
              type:"array"
            }
          );


        const sheet =
          workbook.Sheets[
            workbook.SheetNames[0]
          ];


        const rows =
          XLSX.utils.sheet_to_json(
            sheet,
            {
              defval:""
            }
          );


        totalExcelRows =
          rows.length;


        const payloadRows =
          rows.map(
            r => buildRow(r)
          );


        const result =
          buildBatches(
            payloadRows
          );


        qrBatches =
          result.batches;


        batchRowCounts =
          result.counts;


        currentIndex = 0;


        /* Update statistics */

        totalRows.textContent =
          totalExcelRows;


        totalQR.textContent =
          qrBatches.length;


        if(qrBatches.length > 0){

          generateQR();

        }
        else{

          clearQR();

        }


        /* Log generation */

        track(
          "QR GENERATED - " +
          totalExcelRows +
          " rows / " +
          qrBatches.length +
          " QR"
        );


      }
      catch(error){

        console.error(
          "Excel processing error:",
          error
        );

        alert(
          "Unable to process the Excel file."
        );

      }

    };


  reader.readAsArrayBuffer(file);

}


/* =========================================================
   BUILD SERIAL ROW
========================================================= */

function buildRow(r){

  return "\x01\x17" +
    "1\t" +

    (r["ORDER NUMBER"] || "") +
    "\t" +

    (r["LPN"] || "") +
    "\t" +

    "\f" +

    (r["LOCK CODE"] || "") +
    "\t" +

    (r["ITEM CODE"] || "") +
    "\t" +

    (r["QTY"] || "") +
    "\t" +

    (r["LOT"] || "") +
    "\t" +

    "\t\x01" +

    (r["SERIAL NUMBER"] || "") +
    "\t" +

    "\x05";

}


/* =========================================================
   BUILD QR BATCHES
========================================================= */

function buildBatches(rows){

  let batches = [];

  let counts = [];

  let current = "";

  let rowCount = 0;


  rows.forEach(
    function(row){

      const candidate =
        current
          ? current + row
          : row;


      if(
        candidate.length >
        MAX_QR_LENGTH
      ){

        /*
          Only push current if it
          actually contains data.
        */

        if(current){

          batches.push(current);

          counts.push(rowCount);

        }


        current = row;

        rowCount = 1;

      }
      else{

        current = candidate;

        rowCount++;

      }

    }
  );


  if(current){

    batches.push(current);

    counts.push(rowCount);

  }


  return {

    batches:batches,

    counts:counts

  };

}


/* =========================================================
   GENERATE QR
========================================================= */

function generateQR(){

  if(
    qrBatches.length === 0
  ){

    return;

  }


  const rightPanel =
    document.querySelector(
      ".right-panel"
    );


  const topStatus =
    document.querySelector(
      ".top-status"
    );


  const navigation =
    document.querySelector(
      ".navigation"
    );


  const topHeight =
    topStatus.offsetHeight;


  const navHeight =
    navigation.offsetHeight;


  const availableHeight =
    rightPanel.clientHeight -
    topHeight -
    navHeight -
    45;


  const availableWidth =
    rightPanel.clientWidth -
    45;


  const size =
    Math.max(
      100,
      Math.min(
        availableHeight,
        availableWidth
      )
    );


  const moduleWidth =
    parseInt(
      moduleWidthInput.value
    ) || 4;


  const dpi =
    parseInt(
      dpiInput.value
    ) || 96;


  const scale =
    dpi / 96;


  qrCanvas.width =
    size * scale;


  qrCanvas.height =
    size * scale;


  qrCanvas.style.width =
    size + "px";


  qrCanvas.style.height =
    size + "px";


  const ctx =
    qrCanvas.getContext(
      "2d"
    );


  ctx.setTransform(
    scale,
    0,
    0,
    scale,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  QRCode.toCanvas(

    qrCanvas,

    qrBatches[
      currentIndex
    ],

    {

      errorCorrectionLevel:"L",

      width:size,

      margin:moduleWidth,

      color:{
        dark:"#000000",
        light:"#ffffff"
      }

    },

    function(error){

      if(error){

        console.error(
          "QR generation error:",
          error
        );

      }

    }

  );


  counter.textContent =
    (currentIndex + 1) +
    " / " +
    qrBatches.length;


  info.textContent =
    batchRowCounts[
      currentIndex
    ];

}


/* =========================================================
   PREVIOUS QR
========================================================= */

function prevQR(){

  if(
    currentIndex > 0
  ){

    currentIndex--;

    generateQR();

  }

}


/* =========================================================
   NEXT QR
========================================================= */

function nextQR(){

  if(
    currentIndex <
    qrBatches.length - 1
  ){

    currentIndex++;

    generateQR();

  }

}


/* =========================================================
   CLEAR QR
========================================================= */

function clearQR(){

  const ctx =
    qrCanvas.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    qrCanvas.width,
    qrCanvas.height
  );


  counter.textContent =
    "0 / 0";


  info.textContent =
    "0";


  totalRows.textContent =
    "0";


  totalQR.textContent =
    "0";

}


/* =========================================================
   DOWNLOAD QR
========================================================= */

function downloadQR(){

  if(
    qrBatches.length === 0
  ){

    return;

  }


  const format =
    imageFormatSelect.value;


  const link =
    document.createElement(
      "a"
    );


  link.download =
    "serial_qr_" +
    (currentIndex + 1) +
    "." +
    format;


  link.href =
    qrCanvas.toDataURL(
      "image/" + format
    );


  link.click();


  track(
    "QR DOWNLOAD - QR " +
    (currentIndex + 1)
  );

}


/* =========================================================
   PAGE RESET
========================================================= */

function refreshApp(){

  /*
    Log reset BEFORE clearing data
  */

  track(
    "PAGE RESET"
  );


  qrBatches = [];

  batchRowCounts = [];

  currentIndex = 0;

  totalExcelRows = 0;


  clearQR();


  fileInput.value = "";


  fileInput.focus();

}

</script>

</body>
</html>
