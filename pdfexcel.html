<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Smart PDF Extractor</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; font-size: 12px; padding: 5px; }
    th { background: #f2f2f2; }
  </style>
</head>

<body>

<h2>Smart PDF → Excel Converter</h2>

<input type="file" id="file" />
<button onclick="run()">Convert PDF</button>
<button onclick="download()">Download Excel</button>

<table>
  <thead>
    <tr>
      <th>SN</th>
      <th>Item Code</th>
      <th>Description</th>
      <th>Qty</th>
      <th>LPN</th>
      <th>Allocated Qty</th>
    </tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<script>

let result = [];

async function run() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  let allRows = [];

  for (let p = 1; p <= pdf.numPages; p++) {

    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    let items = content.items.map(i => ({
      text: i.str,
      x: i.transform[4],
      y: i.transform[5]
    }));

    // group by Y (row detection)
    let rowsMap = {};

    items.forEach(it => {
      let y = Math.round(it.y);
      if (!rowsMap[y]) rowsMap[y] = [];
      rowsMap[y].push(it);
    });

    for (let y in rowsMap) {

      let row = rowsMap[y].sort((a,b)=>a.x-b.x);

      let line = row.map(r=>r.text).join(" ");

      // fix broken LPN (MNG_BAL / split fix)
      line = line.replace("MNG_BAL /", "MNG_BAL/");

      let sn = line.match(/^\d+/)?.[0] || "";

      let item = line.match(/\b[A-Z0-9]{6,}\b/)?.[0] || "";

      let qty = "";
      let alloc = "";

      let qtyMatch = line.match(/\b\d+\b/g);
      if (qtyMatch && qtyMatch.length > 0) {
        qty = qtyMatch[1] || qtyMatch[0];
        alloc = qtyMatch[qtyMatch.length - 1] || "";
      }

      let lpnMatch = line.match(/MNG_BAL\/\S*/);
      let lpn = lpnMatch ? lpnMatch[0] : "";

      let desc = line
        .replace(sn, "")
        .replace(item, "")
        .replace(lpn, "")
        .replace(qty, "")
        .replace(alloc, "")
        .trim();

      // VALID ROW CHECK
      if (sn && item && lpn) {
        allRows.push({
          SN: sn,
          "Item Code": item,
          Description: desc,
          Qty: qty,
          LPN: lpn,
          "Allocated Qty": alloc
        });
      }
    }
  }

  result = allRows;
  draw();
}

function draw() {
  let body = document.getElementById("body");
  body.innerHTML = "";

  result.forEach(r => {
    body.innerHTML += `
      <tr>
        <td>${r.SN}</td>
        <td>${r["Item Code"]}</td>
        <td>${r.Description}</td>
        <td>${r.Qty}</td>
        <td>${r.LPN}</td>
        <td>${r["Allocated Qty"]}</td>
      </tr>
    `;
  });
}

function download() {

  if (!result.length) return alert("No data found");

  const ws = XLSX.utils.json_to_sheet(result);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  XLSX.writeFile(wb, "picklist.xlsx");
}

</script>

</body>
</html>
