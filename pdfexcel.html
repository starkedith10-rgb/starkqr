<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PDF Fix Converter</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; font-size: 12px; }
    th { background: #eee; }
    button { padding: 10px; margin: 5px; }
  </style>
</head>

<body>

<h2>PDF FIX → Excel Export (Correct Version)</h2>

<input type="file" id="pdfFile" />
<br>
<button onclick="convertPDF()">Convert</button>
<button onclick="downloadExcel()">Download Excel</button>

<table>
  <thead>
    <tr>
      <th>SN</th>
      <th>Item Code</th>
      <th>Description</th>
      <th>Qty</th>
      <th>LPN</th>
      <th>Allocated Qty</th>
    </tr>
  </thead>
  <tbody id="tbl"></tbody>
</table>

<script>

let finalData = [];

async function convertPDF() {

  const file = document.getElementById("pdfFile").files[0];
  if (!file) return alert("Select PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(this.result) }).promise;

    let rows = [];

    for (let p = 1; p <= pdf.numPages; p++) {

      const page = await pdf.getPage(p);
      const content = await page.getTextContent();

      let items = content.items.map(i => ({
        text: i.str,
        x: i.transform[4],
        y: i.transform[5]
      }));

      // group by Y position (row detection)
      let map = {};

      items.forEach(it => {
        let y = Math.round(it.y);

        if (!map[y]) map[y] = [];
        map[y].push(it);
      });

      Object.keys(map).forEach(y => {

        let line = map[y]
          .sort((a, b) => a.x - b.x)
          .map(i => i.text)
          .join(" ");

        // clean split logic
        let parts = line.split(/\s{2,}/);

        let snMatch = line.match(/^(\d+)\s+([A-Z0-9]+)/);

        if (snMatch && parts.length >= 3) {

          let sn = snMatch[1];
          let item = snMatch[2];

          let qty = "";
          let lpn = "";
          let alloc = "";

          parts.forEach(p => {
            if (p.match(/MNG_BAL/)) lpn = p;
            if (/^\d+$/.test(p.trim()) && p.length <= 3) {
              qty = p;
            }
            if (/^\d+$/.test(p.trim()) && p.length <= 2) {
              alloc = p;
            }
          });

          let desc = line
            .replace(sn, "")
            .replace(item, "")
            .replace(lpn, "")
            .replace(qty, "")
            .replace(alloc, "")
            .trim();

          rows.push({
            SN: sn,
            "Item Code": item,
            Description: desc,
            Qty: qty,
            LPN: lpn,
            "Allocated Qty": alloc
          });
        }

      });
    }

    finalData = rows;
    render();
  };

  reader.readAsArrayBuffer(file);
}

function render() {
  let tbody = document.getElementById("tbl");
  tbody.innerHTML = "";

  finalData.forEach(r => {
    let tr = `<tr>
      <td>${r.SN}</td>
      <td>${r["Item Code"]}</td>
      <td>${r.Description}</td>
      <td>${r.Qty}</td>
      <td>${r.LPN}</td>
      <td>${r["Allocated Qty"]}</td>
    </tr>`;
    tbody.innerHTML += tr;
  });
}

function downloadExcel() {

  if (!finalData.length) return alert("No data");

  let ws = XLSX.utils.json_to_sheet(finalData);
  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");

  XLSX.writeFile(wb, "output.xlsx");
}

</script>

</body>
</html>
