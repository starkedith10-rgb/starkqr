<!DOCTYPE html>
<html>
<head>
  <title>PDF Pick List Parser</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 13px;
    }

    th {
      background: #f2f2f2;
    }

    input {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<h2>Pick List PDF Parser</h2>

<input type="file" id="fileInput" />

<table id="resultTable">
  <thead>
    <tr>
      <th>SN</th>
      <th>Item Code</th>
      <th>Description</th>
      <th>Qty</th>
      <th>LPN</th>
      <th>Allocated Qty</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

const fileInput = document.getElementById("fileInput");

fileInput.addEventListener("change", async function (e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = async function () {
    const typedarray = new Uint8Array(this.result);

    const pdf = await pdfjsLib.getDocument(typedarray).promise;

    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();

      const pageText = textContent.items.map(item => item.str).join(" ");
      fullText += "\n" + pageText;
    }

    processText(fullText);
  };

  reader.readAsArrayBuffer(file);
});

function processText(text) {

  let lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  let rows = [];
  let current = null;

  const isNewRow = (line) => /^\d+\s+/.test(line);

  for (let line of lines) {

    if (line.includes("Pick List Report")) continue;
    if (line.includes("SN Item Code")) continue;
    if (line.includes("Ord Qty")) continue;

    if (isNewRow(line)) {

      let parts = line.split(" ");

      current = {
        sn: parts[0],
        itemCode: parts[1] || "",
        description: parts.slice(2).join(" "),
        qty: "",
        lpn: "",
        allocatedQty: ""
      };

      rows.push(current);

    } else if (current) {
      current.description += " " + line;
    }
  }

  let cleaned = rows.map(r => {

    let desc = r.description;

    let qtyMatch = desc.match(/\b\d+\b/);
    let qty = qtyMatch ? qtyMatch[0] : "";

    let lpnMatch = desc.match(/MNG_BAL\/?N?\d+/);
    let lpn = lpnMatch ? lpnMatch[0] : "";

    let nums = desc.match(/\b\d+\b/g);
    let allocatedQty = nums ? nums[nums.length - 1] : "";

    let cleanDesc = desc
      .replace(/MNG_BAL\/?N?\d+/g, "")
      .replace(/\b\d+\b/g, "")
      .replace(/\s+/g, " ")
      .trim();

    return {
      sn: r.sn,
      itemCode: r.itemCode,
      description: cleanDesc,
      qty,
      lpn,
      allocatedQty
    };
  });

  renderTable(cleaned);
}

function renderTable(data) {

  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";

  data.forEach(row => {
    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.sn}</td>
      <td>${row.itemCode}</td>
      <td>${row.description}</td>
      <td>${row.qty}</td>
      <td>${row.lpn}</td>
      <td>${row.allocatedQty}</td>
    `;

    tbody.appendChild(tr);
  });
}

</script>

</body>
</html>
