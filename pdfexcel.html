<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FINAL PDF FIX</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; font-size: 12px; padding: 5px; }
  </style>
</head>

<body>

<h2>FINAL PDF → EXCEL FIX</h2>

<input type="file" id="pdf" />
<button onclick="convert()">Convert</button>
<button onclick="download()">Download Excel</button>

<table>
<thead>
<tr>
  <th>SN</th>
  <th>Item</th>
  <th>Description</th>
  <th>Qty</th>
  <th>LPN</th>
  <th>Allocated</th>
</tr>
</thead>
<tbody id="t"></tbody>
</table>

<script>

let data = [];

async function convert() {

  const file = document.getElementById("pdf").files[0];
  if (!file) return alert("Upload PDF");

  const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;

  let rows = [];

  for (let p = 1; p <= pdf.numPages; p++) {

    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    let items = content.items.map(i => ({
      text: i.str,
      x: i.transform[4],
      y: Math.round(i.transform[5])
    }));

    // group by Y
    let map = {};

    for (let i of items) {
      if (!map[i.y]) map[i.y] = [];
      map[i.y].push(i);
    }

    for (let y in map) {

      let line = map[y].sort((a,b)=>a.x-b.x).map(i=>i.text);

      if (line.length < 4) continue;

      let sn = line[0];
      let item = line[1];

      // find LPN
      let lpnIndex = line.findIndex(x => x.includes("MNG_BAL"));
      let lpn = lpnIndex !== -1 ? line[lpnIndex] : "";

      // qty (number after item usually)
      let qty = line.find(x => /^\d+$/.test(x) && x.length <= 3) || "";

      // allocated (last number)
      let alloc = line[line.length - 1];

      // description = everything between item and LPN
      let descArr = line.slice(2, lpnIndex === -1 ? line.length : lpnIndex);
      let desc = descArr.join(" ");

      if (sn && item && lpn) {
        rows.push({
          SN: sn,
          Item: item,
          Description: desc,
          Qty: qty,
          LPN: lpn,
          Allocated: alloc
        });
      }
    }
  }

  data = rows;
  render();
}

function render() {
  let t = document.getElementById("t");
  t.innerHTML = "";

  data.forEach(r => {
    t.innerHTML += `
      <tr>
        <td>${r.SN}</td>
        <td>${r.Item}</td>
        <td>${r.Description}</td>
        <td>${r.Qty}</td>
        <td>${r.LPN}</td>
        <td>${r.Allocated}</td>
      </tr>
    `;
  });
}

function download() {
  if (!data.length) return alert("No data");

  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  XLSX.writeFile(wb, "output.xlsx");
}

</script>

</body>
</html>
