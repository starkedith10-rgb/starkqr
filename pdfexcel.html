<!DOCTYPE html>
<html>

<head>

  <title>PDF TO EXCEL - SMART PARSER</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>

    body{
      font-family:Arial;
      background:#eef2f7;
      padding:20px;
    }

    .box{
      max-width:1400px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
    }

    button{
      background:#2d63d1;
      color:white;
      border:none;
      padding:10px 15px;
      margin:10px;
      border-radius:6px;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th{
      background:#1f2a3a;
      color:white;
      padding:10px;
      position:sticky;
      top:0;
    }

    td{
      border:1px solid #ddd;
      padding:8px;
      font-size:13px;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>SMART PDF TO EXCEL CONVERTER</h2>

  <input type="file" id="file" accept="application/pdf">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="downloadExcel()">Download Excel</button>

  <table>

    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Qty</th>
        <th>Location</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>

    <tbody id="body"></tbody>

  </table>

</div>

<script>

let rows = [];

async function convert(){

  const file = document.getElementById("file").files[0];
  if(!file) return alert("Select PDF");

  const reader = new FileReader();

  reader.onload = async function(){

    const pdf = await pdfjsLib.getDocument(
      new Uint8Array(this.result)
    ).promise;

    let text = "";

    for(let i=1;i<=pdf.numPages;i++){

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x => x.str).join(" ") + " ";
    }

    parseSmart(text);
    render();

  };

  reader.readAsArrayBuffer(file);
}


function cleanTokens(text){

  return text
    .replace(/Page Nbr \d+/g,'')
    .replace(/\s+/g,' ')
    .trim()
    .split(' ');
}


// SMART PARSER
function parseSmart(text){

  rows = [];

  const tokens = cleanTokens(text);

  let i = 0;

  while(i < tokens.length){

    // detect SN (number)
    if(/^\d+$/.test(tokens[i])){

      let sn = tokens[i];
      i++;

      // ITEM CODE (usually alpha numeric)
      let item = tokens[i] || "";
      i++;

      // DESCRIPTION until we hit number (Qty)
      let desc = "";

      while(i < tokens.length && !/^\d+$/.test(tokens[i])){

        desc += tokens[i] + " ";
        i++;

      }

      desc = desc.trim();

      // ORD QTY
      let qty = tokens[i] || "";
      i++;

      // LOCATION (may include slash)
      let location = tokens[i] || "";
      i++;

      // LPN
      let lpn = tokens[i] || "";
      i++;

      // ALLOCATED QTY (optional)
      let alloc = tokens[i] || "";
      i++;

      rows.push([
        sn,
        item,
        desc,
        qty,
        location,
        lpn,
        alloc
      ]);

    } else {
      i++;
    }

  }

}


function render(){

  let html = "";

  rows.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
      <td>${r[6]}</td>
    </tr>`;

  });

  document.getElementById("body").innerHTML = html;

}


function downloadExcel(){

  if(rows.length === 0){
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN","Item Code","Description","Qty","Location","LPN","Allocated Qty"],
    ...rows
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb,"PickList.xlsx");

}

</script>

</body>
</html>
