<!DOCTYPE html>
<html>

<head>

  <title>PDF TO EXCEL CONVERTER</title>

  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- PDF JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#eef2f7;
      padding:30px;
    }

    .container{
      max-width:1400px;
      margin:auto;
      background:white;
      border-radius:14px;
      padding:25px;
      box-shadow:0 4px 14px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#1f2a3a;
    }

    .upload-box{
      border:2px dashed #2d63d1;
      border-radius:12px;
      padding:40px;
      text-align:center;
      background:#f5f8ff;
    }

    input[type=file]{
      margin-bottom:20px;
    }

    button{
      background:#2d63d1;
      color:white;
      border:none;
      padding:12px 22px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin:10px;
    }

    button:hover{
      background:#1e4db1;
    }

    .table-container{
      margin-top:30px;
      overflow:auto;
      max-height:600px;
      border:1px solid #ddd;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#1f2a3a;
      color:white;
      padding:12px;
      position:sticky;
      top:0;
      font-size:14px;
    }

    td{
      border-bottom:1px solid #ddd;
      padding:10px;
      font-size:13px;
      vertical-align:top;
    }

    tr:nth-child(even){
      background:#f9fafc;
    }

    tr:hover{
      background:#eef4ff;
    }

    .loading{
      text-align:center;
      margin-top:20px;
      color:#2d63d1;
      font-weight:bold;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>PDF TO EXCEL CONVERTER</h1>

  <div class="upload-box">

    <input
      type="file"
      id="pdfFile"
      accept="application/pdf"
    >

    <br>

    <button onclick="processPDF()">
      Convert PDF
    </button>

    <button onclick="downloadExcel()">
      Download Excel
    </button>

    <div class="loading" id="loading"></div>

  </div>

  <div class="table-container">

    <table>

      <thead>

        <tr>
          <th>SN</th>
          <th>Item Code</th>
          <th>Description</th>
          <th>Qty</th>
          <th>Location</th>
          <th>LPN</th>
          <th>Lot</th>
        </tr>

      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<script>

let extractedRows = [];

async function processPDF(){

  const file =
    document.getElementById("pdfFile").files[0];

  if(!file){
    alert("Please select PDF");
    return;
  }

  document.getElementById("loading").innerText =
    "Processing PDF...";

  extractedRows = [];

  const reader = new FileReader();

  reader.onload = async function(){

    try{

      const typedarray =
        new Uint8Array(this.result);

      const pdf =
        await pdfjsLib.getDocument({
          data: typedarray
        }).promise;

      let fullText = "";

      for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

        const page =
          await pdf.getPage(pageNum);

        const textContent =
          await page.getTextContent();

        const pageText =
          textContent.items
            .map(item => item.str)
            .join(" ");

        fullText += pageText + "\n";
      }

      parsePDFData(fullText);

      renderTable();

      document.getElementById("loading").innerText =
        "PDF Converted Successfully";

    }catch(err){

      console.log(err);

      document.getElementById("loading").innerText =
        "Error reading PDF";

    }

  };

  reader.readAsArrayBuffer(file);
}


function parsePDFData(text){

  /*
    Detect rows starting with:
    1 B0HODUNE9 ...
    2 ELE000795 ...
  */

  const regex =
    /(\d+)\s+([A-Z0-9]+)\s+(.*?)\s+(\d+)\s+([A-Z0-9_\/\-]+)\s+(\d+)\s+(SRNLOT[0-9]+)/g;

  let match;

  while((match = regex.exec(text)) !== null){

    extractedRows.push([
      match[1], // SN
      match[2], // Item Code
      match[3], // Description
      match[4], // Qty
      match[5], // Location
      match[6], // LPN
      match[7]  // LOT
    ]);
  }
}


function renderTable(){

  let html = "";

  extractedRows.forEach(row => {

    html += "<tr>";

    row.forEach(col => {

      html += `
        <td>${col}</td>
      `;
    });

    html += "</tr>";
  });

  document.getElementById("tableBody").innerHTML =
    html;
}


function downloadExcel(){

  if(extractedRows.length === 0){
    alert("No data found");
    return;
  }

  const excelData = [
    [
      "SN",
      "Item Code",
      "Description",
      "Qty",
      "Location",
      "LPN",
      "Lot"
    ],
    ...extractedRows
  ];

  const worksheet =
    XLSX.utils.aoa_to_sheet(excelData);

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "PICKLIST"
  );

  XLSX.writeFile(
    workbook,
    "PickList_Report.xlsx"
  );
}

</script>

</body>
</html>
