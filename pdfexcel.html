<!DOCTYPE html>
<html>

<head>
  <title>PDF TO EXCEL - COPY + TABLE VIEW</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      padding: 20px;
    }

    .box {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 10px;
      background: #2d63d1;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #1f2a3a;
      color: white;
      padding: 8px;
    }

    td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 13px;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      max-height: 250px;
      overflow: auto;
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>PDF → EXCEL (TABLE + COPY VIEW)</h2>

  <input type="file" id="file">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="download()">Download Excel</button>

  <div class="grid">

    <div>
      <h3>📋 Structured Table</h3>
      <table>
        <thead>
          <tr>
            <th>SN</th>
            <th>Item Code</th>
            <th>Description</th>
            <th>Qty</th>
            <th>LPN</th>
            <th>Allocated Qty</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>

    <div>
      <h3>📄 Raw Copy-Paste Output</h3>
      <pre id="raw"></pre>
    </div>

  </div>

</div>

<script>

let finalData = [];
let rawRows = [];

async function convert() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

    let words = [];

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      content.items.forEach(w => {
        words.push({
          text: w.str,
          x: w.transform[4],
          y: Math.round(w.transform[5])
        });
      });
    }

    buildRows(words);
    buildTable(words);

    render();

  };

  reader.readAsArrayBuffer(file);
}


// RAW COPY STYLE
function buildRows(words) {

  let rows = {};

  words.forEach(w => {

    if (!rows[w.y]) rows[w.y] = [];

    rows[w.y].push(w.text);

  });

  let sorted = Object.keys(rows)
    .map(Number)
    .sort((a, b) => b - a);

  rawRows = sorted.map(y => rows[y].join(" "));
}


// STRUCTURED TABLE (OLD STYLE FIXED)
function buildTable(words) {

  finalData = [];

  let rows = {};

  words.forEach(w => {

    let key = w.y;

    if (!rows[key]) rows[key] = [];

    rows[key].push(w);

  });

  Object.keys(rows)
    .map(Number)
    .sort((a, b) => b - a)
    .forEach(y => {

      let line = rows[y]
        .sort((a, b) => a.x - b.x)
        .map(i => i.text)
        .join(" ");

      let parts = line.split(/\s{2,}/);

      let sn = parts[0] || "";
      let item = parts[1] || "";
      let desc = "";
      let qty = "";
      let lpn = "";
      let alloc = "";

      for (let i = 2; i < parts.length; i++) {

        if (parts[i].includes("MNG_BAL")) lpn = parts[i];
        else if (!isNaN(parts[i])) {
          if (!qty) qty = parts[i];
          else alloc = parts[i];
        }
        else desc += parts[i] + " ";
      }

      if (sn && item) {
        finalData.push([
          sn.trim(),
          item.trim(),
          desc.trim(),
          qty.trim(),
          lpn.trim(),
          alloc.trim()
        ]);
      }

    });
}


// RENDER BOTH UI
function render() {

  // TABLE
  let html = "";

  finalData.forEach(r => {
    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;
  });

  document.getElementById("body").innerHTML = html;

  // RAW TEXT
  document.getElementById("raw").textContent =
    rawRows.join("\n");
}


// EXCEL DOWNLOAD
function download() {

  if (!finalData.length) {
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN", "Item Code", "Description", "Qty", "LPN", "Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb, "PickList.xlsx");
}

</script>

</body>
</html>
