<!DOCTYPE html>
<html>

<head>
  <title>PDF TO EXCEL - FIXED PARSER</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      padding: 20px;
    }

    .box {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 10px;
      background: #2d63d1;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #1f2a3a;
      color: white;
      padding: 8px;
    }

    td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>PDF → EXCEL (FIXED ROBUST PARSER)</h2>

  <input type="file" id="file">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="download()">Download Excel</button>

  <table>
    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Qty</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

</div>

<script>

let finalData = [];

async function convert() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

    let words = [];

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      content.items.forEach(w => {
        words.push({
          text: w.str,
          x: w.transform[4],
          y: w.transform[5]
        });
      });
    }

    parse(words);
    render();
  };

  reader.readAsArrayBuffer(file);
}


// FIX 1: better row grouping (VERY IMPORTANT)
function groupRows(words) {

  let rows = [];
  let tolerance = 3;

  words.forEach(w => {

    let row = rows.find(r => Math.abs(r.y - w.y) < tolerance);

    if (!row) {
      row = { y: w.y, items: [] };
      rows.push(row);
    }

    row.items.push(w);
  });

  return rows;
}


// FIX 2: smarter parsing (NO fixed X columns)
function parse(words) {

  finalData = [];

  let rows = groupRows(words);

  rows.sort((a, b) => b.y - a.y);

  rows.forEach(r => {

    let items = r.items.sort((a, b) => a.x - b.x);

    let line = items.map(i => i.text).join(" ");

    let parts = line.split(/\s{2,}/); // split multiple spaces

    // fallback safe split
    let sn = parts[0] || "";
    let item = parts[1] || "";
    let desc = "";
    let qty = "";
    let lpn = "";
    let alloc = "";

    // rebuild smarter (important fix)
    for (let i = 2; i < parts.length; i++) {
      if (parts[i].includes("MNG_BAL")) {
        lpn = parts[i];
      } else if (!isNaN(parts[i])) {
        if (!qty) qty = parts[i];
        else alloc = parts[i];
      } else {
        desc += parts[i] + " ";
      }
    }

    desc = desc.trim();

    // REMOVE empty / junk rows
    if (item && sn) {
      finalData.push([
        sn.trim(),
        item.trim(),
        desc,
        qty.trim(),
        lpn.trim(),
        alloc.trim()
      ]);
    }

  });
}


// RENDER
function render() {

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;

  });

  document.getElementById("body").innerHTML = html;
}


// DOWNLOAD EXCEL
function download() {

  if (!finalData.length) {
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN", "Item Code", "Description", "Qty", "LPN", "Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb, "PickList.xlsx");
}

</script>

</body>
</html>
