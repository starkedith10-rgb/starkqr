<!DOCTYPE html>
<html>

<head>
  <title>PDF TO EXCEL - PRO LEVEL</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      padding: 20px;
    }

    .box {
      max-width: 1250px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 8px;
      background: #2d63d1;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background: #1f2a3a;
      color: white;
      padding: 8px;
      font-size: 13px;
    }

    td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    pre {
      background: #0f172a;
      color: #00ff88;
      padding: 10px;
      height: 420px;
      overflow: auto;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📄 PDF → EXCEL (WAREHOUSE GRADE PARSER)</h2>

  <input type="file" id="file">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="download()">Download Excel</button>

  <div class="grid">

    <div>
      <h3>📊 Structured Output</h3>
      <table>
        <thead>
          <tr>
            <th>SN</th>
            <th>Item Code</th>
            <th>Description</th>
            <th>Qty</th>
            <th>LPN</th>
            <th>Allocated</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>

    <div>
      <h3>📋 Raw Copy Output</h3>
      <pre id="raw"></pre>
    </div>

  </div>

</div>

<script>

let finalData = [];
let rawLines = [];

async function convert() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

    let words = [];

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      content.items.forEach(w => {
        words.push({
          text: w.str,
          x: w.transform[4],
          y: Math.round(w.transform[5])
        });
      });

    }

    buildRows(words);
    buildTable(words);
    render();

  };

  reader.readAsArrayBuffer(file);
}


// ------------------------------
// 1. SMART ROW GROUPING (FIXED)
// ------------------------------
function groupByRow(words) {

  let rows = [];
  let tolerance = 3;

  words.forEach(w => {

    let row = rows.find(r => Math.abs(r.y - w.y) <= tolerance);

    if (!row) {
      row = { y: w.y, items: [] };
      rows.push(row);
    }

    row.items.push(w);

  });

  return rows;
}


// ------------------------------
// 2. RAW COPY OUTPUT
// ------------------------------
function buildRows(words) {

  let rows = groupByRow(words);

  rows.sort((a, b) => b.y - a.y);

  rawLines = rows.map(r =>
    r.items
      .sort((a, b) => a.x - b.x)
      .map(i => i.text)
      .join(" ")
  );
}


// ------------------------------
// 3. STRUCTURED TABLE PARSER
// ------------------------------
function buildTable(words) {

  finalData = [];

  let rows = groupByRow(words);

  rows.sort((a, b) => b.y - a.y);

  rows.forEach(r => {

    let line = r.items
      .sort((a, b) => a.x - b.x)
      .map(i => i.text)
      .join(" ");

    let parts = line.split(/\s{2,}/);

    let sn = parts[0] || "";
    let item = parts[1] || "";
    let desc = "";
    let qty = "";
    let lpn = "";
    let alloc = "";

    for (let i = 2; i < parts.length; i++) {

      if (parts[i].includes("MNG_BAL")) {
        lpn = parts[i];
      }

      else if (!isNaN(parts[i]) && parts[i] !== "") {
        if (!qty) qty = parts[i];
        else alloc = parts[i];
      }

      else {
        desc += parts[i] + " ";
      }
    }

    desc = desc.trim();

    if (sn && item) {
      finalData.push([sn, item, desc, qty, lpn, alloc]);
    }

  });
}


// ------------------------------
// 4. RENDER UI
// ------------------------------
function render() {

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;

  });

  document.getElementById("table").innerHTML = html;

  document.getElementById("raw").textContent =
    rawLines.join("\n");
}


// ------------------------------
// 5. EXCEL DOWNLOAD
// ------------------------------
function download() {

  if (!finalData.length) {
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN", "Item Code", "Description", "Qty", "LPN", "Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "PickList");

  XLSX.writeFile(wb, "PickList.xlsx");
}

</script>

</body>
</html>
