<!DOCTYPE html>
<html>

<head>

  <title>PDF → EXCEL CLEAN PICKLIST</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>

    body{
      font-family:Arial;
      background:#eef2f7;
      padding:20px;
    }

    .box{
      max-width:1200px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    button{
      background:#2d63d1;
      color:white;
      border:none;
      padding:10px 15px;
      margin:10px;
      border-radius:6px;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th{
      background:#1f2a3a;
      color:white;
      padding:10px;
      position:sticky;
      top:0;
    }

    td{
      border:1px solid #ddd;
      padding:8px;
      font-size:13px;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>PDF → EXCEL CLEAN PARSER (NO LOCATION)</h2>

  <input type="file" id="file" accept="application/pdf">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="download()">Download Excel</button>

  <table>

    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Qty</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>

    <tbody id="body"></tbody>

  </table>

</div>

<script>

let finalData = [];

async function convert(){

  const file = document.getElementById("file").files[0];
  if(!file) return alert("Select PDF");

  const reader = new FileReader();

  reader.onload = async function(){

    const pdf = await pdfjsLib.getDocument(
      new Uint8Array(this.result)
    ).promise;

    let text = "";

    for(let i=1;i<=pdf.numPages;i++){

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x => x.str).join(" ") + " ";
    }

    parse(text);
    render();

  };

  reader.readAsArrayBuffer(file);
}


// CLEAN NOISE
function clean(text){

  return text
    .replace(/Pick List Report.*?FIFO/g,'')
    .replace(/Page Nbr \d+/g,'')
    .replace(/\s+/g,' ')
    .trim();
}


// PARSER (NO LOCATION)
function parse(text){

  finalData = [];

  text = clean(text);

  const rows = text.split(/(?=\d+\s+[A-Z0-9]{5,})/);

  rows.forEach(r => {

    let p = r.trim().split(" ");

    if(!/^\d+$/.test(p[0])) return;

    let sn = p[0];
    let item = p[1];

    // find qty index
    let qtyIndex = -1;

    for(let i=2;i<p.length;i++){
      if(/^\d+$/.test(p[i])){
        qtyIndex = i;
        break;
      }
    }

    if(qtyIndex === -1) return;

    let desc = p.slice(2, qtyIndex).join(" ");
    let qty = p[qtyIndex] || "";

    // AFTER QTY:
    let lpn = p[qtyIndex+1] || "";
    let alloc = p[qtyIndex+2] || "";

    finalData.push([
      sn,
      item,
      desc,
      qty,
      lpn,
      alloc
    ]);

  });

}


// RENDER TABLE
function render(){

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;

  });

  document.getElementById("body").innerHTML = html;

}


// DOWNLOAD EXCEL
function download(){

  if(finalData.length === 0){
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN","Item Code","Description","Qty","LPN","Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb,"PickList.xlsx");

}

</script>

</body>
</html>
