<!DOCTYPE html>
<html>

<head>

  <title>PDF TO EXCEL CONVERTER</title>

  <!-- PDF JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#eef2f7;
      padding:30px;
    }

    .container{
      max-width:1500px;
      margin:auto;
      background:white;
      border-radius:12px;
      padding:25px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#1f2a3a;
    }

    .upload-box{
      border:2px dashed #2d63d1;
      background:#f5f8ff;
      border-radius:10px;
      padding:40px;
      text-align:center;
    }

    input[type=file]{
      margin-bottom:20px;
    }

    button{
      background:#2d63d1;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      margin:10px;
    }

    button:hover{
      background:#1f4fb7;
    }

    .status{
      margin-top:15px;
      color:#2d63d1;
      font-weight:bold;
    }

    .table-box{
      margin-top:30px;
      overflow:auto;
      border:1px solid #ddd;
      border-radius:10px;
      max-height:650px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#1f2a3a;
      color:white;
      padding:12px;
      position:sticky;
      top:0;
      font-size:14px;
      text-align:left;
    }

    td{
      border-bottom:1px solid #ddd;
      padding:10px;
      font-size:13px;
      vertical-align:top;
    }

    tr:nth-child(even){
      background:#f9fafc;
    }

    tr:hover{
      background:#eef4ff;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>PDF TO EXCEL CONVERTER</h1>

  <div class="upload-box">

    <input
      type="file"
      id="pdfFile"
      accept="application/pdf"
    >

    <br>

    <button onclick="processPDF()">
      Convert PDF
    </button>

    <button onclick="downloadExcel()">
      Download Excel
    </button>

    <div class="status" id="status"></div>

  </div>

  <div class="table-box">

    <table>

      <thead>

        <tr>
          <th>SN</th>
          <th>Item Code</th>
          <th>Description</th>
          <th>Qty</th>
          <th>Location</th>
          <th>LPN</th>
          <th>Lot</th>
        </tr>

      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<script>

let extractedRows = [];

async function processPDF(){

  const file =
    document.getElementById("pdfFile").files[0];

  if(!file){

    alert("Please select PDF");

    return;
  }

  document.getElementById("status").innerText =
    "Reading PDF...";

  extractedRows = [];

  const reader = new FileReader();

  reader.onload = async function(){

    try{

      const typedarray =
        new Uint8Array(this.result);

      const pdf =
        await pdfjsLib.getDocument({
          data: typedarray
        }).promise;

      let fullText = "";

      // READ ALL PAGES
      for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

        const page =
          await pdf.getPage(pageNum);

        const textContent =
          await page.getTextContent();

        const pageText =
          textContent.items
            .map(item => item.str)
            .join(" ");

        fullText += pageText + " ";
      }

      console.log(fullText);

      parseData(fullText);

      renderTable();

      document.getElementById("status").innerText =
        "PDF Converted Successfully";

    }catch(err){

      console.log(err);

      document.getElementById("status").innerText =
        "Error Reading PDF";
    }

  };

  reader.readAsArrayBuffer(file);
}


function parseData(text){

  extractedRows = [];

  // REMOVE EXTRA SPACES
  text = text.replace(/\s+/g, " ");

  /*
    SPLIT USING:
    1 ITEMCODE
    2 ITEMCODE
  */

  const rows =
    text.split(/(?=\d+\s+[A-Z0-9]{5,})/);

  rows.forEach(row => {

    row = row.trim();

    if(row.length < 10) return;

    const parts = row.split(" ");

    const sn =
      parts[0];

    const itemCode =
      parts[1];

    // VALIDATE SERIAL NUMBER
    if(!/^\d+$/.test(sn)){
      return;
    }

    // FIND FIRST QTY
    let qtyIndex = -1;

    for(let i=2; i<parts.length; i++){

      if(/^\d+$/.test(parts[i])){

        qtyIndex = i;

        break;
      }
    }

    if(qtyIndex === -1) return;

    // DESCRIPTION
    const description =
      parts.slice(2, qtyIndex).join(" ");

    // QTY
    const qty =
      parts[qtyIndex] || "";

    // LOCATION
    const location =
      parts[qtyIndex + 1] || "";

    // LPN
    const lpn =
      parts[qtyIndex + 2] || "";

    // LOT
    const lot =
      parts.find(x => x.includes("SRNLOT")) || "";

    extractedRows.push([
      sn,
      itemCode,
      description,
      qty,
      location,
      lpn,
      lot
    ]);

  });

  console.log(extractedRows);
}


function renderTable(){

  let html = "";

  extractedRows.forEach(row => {

    html += `
      <tr>
        <td>${row[0]}</td>
        <td>${row[1]}</td>
        <td>${row[2]}</td>
        <td>${row[3]}</td>
        <td>${row[4]}</td>
        <td>${row[5]}</td>
        <td>${row[6]}</td>
      </tr>
    `;
  });

  document.getElementById("tableBody").innerHTML =
    html;
}


function downloadExcel(){

  if(extractedRows.length === 0){

    alert("No data found");

    return;
  }

  const excelData = [

    [
      "SN",
      "Item Code",
      "Description",
      "Qty",
      "Location",
      "LPN",
      "Lot"
    ],

    ...extractedRows
  ];

  const worksheet =
    XLSX.utils.aoa_to_sheet(excelData);

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "PDF DATA"
  );

  XLSX.writeFile(
    workbook,
    "PickList.xlsx"
  );
}

</script>

</body>
</html>
