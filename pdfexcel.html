<!DOCTYPE html>
<html>

<head>
  <title>PDF TO CLEAN TABLE EXTRACTOR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; background:#eef2f7; padding:20px; }

    .box {
      max-width:1000px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
    }

    button {
      background:#2d63d1;
      color:white;
      padding:10px;
      border:none;
      margin:10px;
      cursor:pointer;
      border-radius:6px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th {
      background:#1f2a3a;
      color:white;
      padding:8px;
    }

    td {
      border:1px solid #ddd;
      padding:6px;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>PDF → CLEAN EXCEL FORMAT</h2>

  <input type="file" id="file">

  <button onclick="convert()">Convert</button>
  <button onclick="download()">Download Excel</button>

  <table>
    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Qty</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

</div>

<script>

let finalData = [];

async function convert() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x => x.str).join(" ") + " ";
    }

    parse(text);
    render();

  };

  reader.readAsArrayBuffer(file);
}


// CLEAN PARSER (FINAL LOGIC)
function parse(text) {

  finalData = [];

  text = text.replace(/\s+/g, ' ').trim();

  // split by SN pattern
  let rows = text.split(/(?=\b\d+\s+[A-Z0-9]{5,})/);

  rows.forEach(r => {

    let t = r.trim();
    if (!t) return;

    let p = t.split(" ");

    let sn = p[0];
    if (!/^\d+$/.test(sn)) return;

    let item = p[1] || "";

    let qty = "";
    let qtyIndex = -1;

    for (let i = 2; i < p.length; i++) {
      if (/^\d+$/.test(p[i])) {
        qty = p[i];
        qtyIndex = i;
        break;
      }
    }

    if (qtyIndex === -1) return;

    // LPN detection (contains / or long string)
    let lpn = "";
    let alloc = "";

    for (let i = qtyIndex + 1; i < p.length; i++) {

      if (p[i].includes("/")) {
        lpn = p[i];
      }

      if (/^\d+$/.test(p[i])) {
        alloc = p[i];
      }
    }

    let desc = p.slice(2, qtyIndex).join(" ");

    finalData.push([
      sn,
      item,
      desc,
      qty,
      lpn,
      alloc
    ]);

  });

}


// RENDER
function render() {

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;

  });

  document.getElementById("body").innerHTML = html;
}


// DOWNLOAD
function download() {

  if (finalData.length === 0) {
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN","Item Code","Description","Qty","LPN","Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb, "PickList.xlsx");
}

</script>

</body>
</html>
