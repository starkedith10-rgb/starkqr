<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PDF to Excel Converter</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- SheetJS (Excel export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
    }
    th {
      background: #f2f2f2;
    }
    button {
      padding: 10px;
      margin: 10px 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>PDF → Clean Table → Excel Export</h2>

<input type="file" id="pdfFile" accept="application/pdf" />
<br>

<button onclick="processPDF()">Convert PDF</button>
<button onclick="downloadExcel()">Download Excel</button>

<table id="outputTable">
  <thead>
    <tr>
      <th>SN</th>
      <th>Item Code</th>
      <th>Description</th>
      <th>Qty</th>
      <th>LPN</th>
      <th>Allocated Qty</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

let finalData = [];

async function processPDF() {
  const file = document.getElementById("pdfFile").files[0];
  if (!file) {
    alert("Select PDF first");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function () {
    const typedarray = new Uint8Array(this.result);

    const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;

    let allText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      const strings = content.items.map(item => item.str);
      allText += strings.join(" ") + "\n";
    }

    parseData(allText);
  };

  reader.readAsArrayBuffer(file);
}

function parseData(text) {

  finalData = [];

  // split lines
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  let current = null;

  for (let line of lines) {

    // detect SN line (number + item code)
    let match = line.match(/^(\d+)\s+([A-Z0-9]+)\s+(.+?)\s+(\d+)\s+(MNG_BAL\/\S*)\s+(\d+)/);

    if (match) {
      current = {
        sn: match[1],
        item: match[2],
        desc: match[3],
        qty: match[4],
        lpn: match[5],
        alloc: match[6]
      };
      finalData.push(current);
    }
  }

  renderTable();
}

function renderTable() {
  const tbody = document.querySelector("#outputTable tbody");
  tbody.innerHTML = "";

  finalData.forEach(row => {
    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.sn}</td>
      <td>${row.item}</td>
      <td>${row.desc}</td>
      <td>${row.qty}</td>
      <td>${row.lpn}</td>
      <td>${row.alloc}</td>
    `;

    tbody.appendChild(tr);
  });
}

function downloadExcel() {

  if (!finalData.length) {
    alert("No data to export");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(finalData.map(r => ({
    SN: r.sn,
    "Item Code": r.item,
    Description: r.desc,
    Qty: r.qty,
    LPN: r.lpn,
    "Allocated Qty": r.alloc
  })));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data");

  XLSX.writeFile(wb, "output.xlsx");
}

</script>

</body>
</html>
