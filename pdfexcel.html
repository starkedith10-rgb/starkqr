<!DOCTYPE html>
<html>

<head>

  <title>PDF TO EXCEL - PICKLIST PARSER</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>

    body{
      font-family:Arial;
      background:#eef2f7;
      padding:25px;
    }

    .container{
      max-width:1400px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input, button{
      margin:10px;
      padding:10px;
    }

    button{
      background:#2d63d1;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    button:hover{
      background:#1e4db1;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th{
      background:#1f2a3a;
      color:white;
      padding:10px;
      position:sticky;
      top:0;
    }

    td{
      border:1px solid #ddd;
      padding:8px;
      font-size:13px;
      vertical-align:top;
    }

    tr:nth-child(even){
      background:#f7f9fc;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>PDF TO EXCEL PICKLIST PARSER</h2>

  <input type="file" id="file" accept="application/pdf">

  <button onclick="convertPDF()">Convert PDF</button>
  <button onclick="downloadExcel()">Download Excel</button>

  <table>

    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Ord Qty</th>
        <th>Location</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>

    <tbody id="tbody"></tbody>

  </table>

</div>

<script>

let finalData = [];

async function convertPDF(){

  const file = document.getElementById("file").files[0];
  if(!file){
    alert("Select PDF");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(){

    const pdf = await pdfjsLib.getDocument(
      new Uint8Array(this.result)
    ).promise;

    let text = "";

    for(let i=1;i<=pdf.numPages;i++){

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      text += content.items.map(x => x.str).join(" ") + " ";
    }

    parseData(text);
    renderTable();

  };

  reader.readAsArrayBuffer(file);
}


function parseData(text){

  finalData = [];

  text = text.replace(/\s+/g,' ');

  // Split rows using SN pattern
  const rows = text.split(/(?=\d+\s+[A-Z0-9]{4,})/);

  rows.forEach(row => {

    let p = row.trim().split(" ");

    if(!/^\d+$/.test(p[0])) return;

    let sn = p[0];
    let item = p[1];

    // find first numeric value = ORD QTY
    let qtyIndex = -1;

    for(let i=2;i<p.length;i++){
      if(/^\d+$/.test(p[i])){
        qtyIndex = i;
        break;
      }
    }

    if(qtyIndex === -1) return;

    let desc = p.slice(2, qtyIndex).join(" ");
    let ordQty = p[qtyIndex] || "";
    let location = p[qtyIndex+1] || "";
    let lpn = p[qtyIndex+2] || "";
    let allocQty = p[qtyIndex+3] || "";

    finalData.push([
      sn,
      item,
      desc,
      ordQty,
      location,
      lpn,
      allocQty
    ]);

  });

}


function renderTable(){

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
      <td>${r[6]}</td>
    </tr>`;

  });

  document.getElementById("tbody").innerHTML = html;

}


function downloadExcel(){

  if(finalData.length === 0){
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN","Item Code","Description","Ord Qty","Location","LPN","Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "PICKLIST");

  XLSX.writeFile(wb, "PickList.xlsx");

}

</script>

</body>
</html>
