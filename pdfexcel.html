<!DOCTYPE html>
<html>

<head>
  <title>PDF TO EXCEL - FIXED TABLE PARSER</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 10px;
      background: #2d63d1;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #1f2a3a;
      color: white;
      padding: 8px;
    }

    td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>PDF → EXCEL (FIXED COLUMN PARSER)</h2>

  <input type="file" id="file">

  <button onclick="convert()">Convert PDF</button>
  <button onclick="download()">Download Excel</button>

  <table>
    <thead>
      <tr>
        <th>SN</th>
        <th>Item Code</th>
        <th>Description</th>
        <th>Qty</th>
        <th>LPN</th>
        <th>Allocated Qty</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

</div>

<script>

let finalData = [];

async function convert() {

  const file = document.getElementById("file").files[0];
  if (!file) return alert("Upload PDF");

  const reader = new FileReader();

  reader.onload = async function () {

    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

    let words = [];

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      content.items.forEach(w => {
        words.push({
          text: w.str,
          x: w.transform[4],
          y: w.transform[5]
        });
      });
    }

    parse(words);
    render();

  };

  reader.readAsArrayBuffer(file);
}


// GROUP BY ROW (Y AXIS)
function groupRows(words) {

  let rows = {};

  words.forEach(w => {
    let y = Math.round(w.y);
    if (!rows[y]) rows[y] = [];
    rows[y].push(w);
  });

  return rows;
}


// COLUMN MAPPER (IMPORTANT PART)
function parse(words) {

  finalData = [];

  let rows = groupRows(words);

  let sortedY = Object.keys(rows)
    .map(Number)
    .sort((a, b) => b - a);

  sortedY.forEach(y => {

    let row = rows[y].sort((a, b) => a.x - b.x);

    let sn = "", item = "", desc = "", qty = "", lpn = "", alloc = "";

    row.forEach(w => {

      let x = w.x;

      if (x < 60) sn += w.text + " ";

      else if (x < 160) item += w.text + " ";

      else if (x < 450) desc += w.text + " ";

      else if (x < 520) qty += w.text + " ";

      else if (x < 650) lpn += w.text + " ";

      else alloc += w.text + " ";

    });

    if (sn.trim() && item.trim()) {

      finalData.push([
        sn.trim(),
        item.trim(),
        desc.trim(),
        qty.trim(),
        lpn.trim(),
        alloc.trim()
      ]);

    }

  });

}


// RENDER
function render() {

  let html = "";

  finalData.forEach(r => {

    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
    </tr>`;

  });

  document.getElementById("body").innerHTML = html;
}


// DOWNLOAD
function download() {

  if (finalData.length === 0) {
    alert("No data found");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet([
    ["SN", "Item Code", "Description", "Qty", "LPN", "Allocated Qty"],
    ...finalData
  ]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DATA");

  XLSX.writeFile(wb, "PickList.xlsx");
}

</script>

</body>
</html>
